---
- name: Prepare networking (Fix resolv.conf)
  ansible.builtin.copy:
    content: "nameserver {{ bootstrap_dns | default('1.1.1.1') }}\n"
    dest: /etc/resolv.conf
    mode: '0644'

- name: Wait for outbound DNS/network readiness
  ansible.builtin.command: getent hosts raw.githubusercontent.com
  register: dns_ready
  until: dns_ready.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - tar
    state: present
    update_cache: yes
  register: apt_deps
  until: apt_deps is succeeded
  retries: 5
  delay: 10

- name: Check installed AdGuard Home version
  ansible.builtin.command: /opt/AdGuardHome/AdGuardHome --version
  register: agh_installed
  changed_when: false
  failed_when: false

- name: Install/upgrade AdGuard Home to {{ adguard_version }}
  when: adguard_version not in (agh_installed.stdout | default(''))
  block:
    - name: Stop AdGuardHome before replacing the binary
      ansible.builtin.systemd:
        name: AdGuardHome
        state: stopped
      failed_when: false

    - name: Download and unarchive pinned AdGuard Home release
      ansible.builtin.unarchive:
        src: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"
        dest: /opt/
        remote_src: yes
      register: agh_download
      until: agh_download is succeeded
      retries: 5
      delay: 10
      notify: restart adguard

- name: Deploy AdGuard configuration from template
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/AdGuardHome/AdGuardHome.yaml
    mode: '0644'
  notify: restart adguard

- name: Install AdGuard Home as a service
  ansible.builtin.command:
    cmd: ./AdGuardHome -s install
    chdir: /opt/AdGuardHome
    creates: /etc/systemd/system/AdGuardHome.service

- name: Configure systemd-resolved to release port 53
  block:
    - name: Create resolved.conf.d directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: '0755'

    - name: Disable DNSStubListener
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/adguardhome.conf
        content: |
          [Resolve]
          DNS=127.0.0.1
          DNSStubListener=no
        mode: '0644'

    - name: Backup and link resolv.conf
      ansible.builtin.shell: |
        rm -f /etc/resolv.conf
        ln -s /run/systemd/resolve/resolv.conf /etc/resolv.conf
      args:
        creates: /run/systemd/resolve/resolv.conf

  notify: 
    - restart resolved
    - restart adguard

- name: Ensure services are started and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
    daemon_reload: yes
  loop:
    - systemd-resolved
    - AdGuardHome