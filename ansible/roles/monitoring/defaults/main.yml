---
# Pinned component versions. Bump here (or from Terraform) and re-apply —
# the role replaces a binary only when the version on disk differs.
prometheus_version: "3.5.0"
alertmanager_version: "0.28.1"
# Empty = latest package from the Grafana apt repo; or pin e.g. "11.6.1".
grafana_version: ""

# --- Prometheus ---------------------------------------------------------
prometheus_listen_address: "0.0.0.0:9090"
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"
prometheus_retention_time: "30d"
prometheus_external_labels: {}

# --- Monitored devices --------------------------------------------------
# The list of devices comes from terraform.tfvars (monitoring_targets).
# Every entry: { name, address, job (optional), labels (optional map) }.
monitoring_targets: []
# Job used by targets that do not name one — plain node_exporter hosts.
monitoring_default_job: node
# Scrape the monitoring VM itself as well, under this name.
monitoring_scrape_self: true
monitoring_self_name: "{{ inventory_hostname }}"

# --- Alerting -----------------------------------------------------------
monitoring_alerts_enabled: true
alertmanager_listen_address: "0.0.0.0:9093"
alertmanager_resolve_timeout: "5m"
# Empty token = alerts are evaluated and visible in the UI but not delivered.
alertmanager_telegram_bot_token: ""
alertmanager_telegram_chat_id: ""

# Alert thresholds (percent / duration).
alert_instance_down_for: "5m"
alert_cpu_threshold: 90
alert_cpu_for: "10m"
alert_memory_threshold: 90
alert_memory_for: "10m"
alert_disk_threshold: 85
alert_disk_for: "15m"

# --- Grafana ------------------------------------------------------------
grafana_listen_port: 3000
grafana_admin_user: admin
grafana_admin_password: admin
grafana_datasource_uid: prometheus
# Dashboards pulled from grafana.com and provisioned on disk.
grafana_dashboards:
  - name: node-exporter-full
    gnet_id: 1860
    revision: 37
