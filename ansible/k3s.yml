---
# Bootstraps the k3s cluster created by modules/k3s_cluster.
# Inventory (ansible/inventory/k3s.ini) is generated by Terraform.
- name: Prepare all k3s nodes
  hosts: k3s
  become: yes
  roles:
    - k3s_common

- name: Bootstrap the k3s server (control plane)
  hosts: k3s_master
  become: yes
  roles:
    - k3s_server

- name: Join the k3s agents (workers)
  hosts: k3s_workers
  become: yes
  roles:
    - k3s_agent
